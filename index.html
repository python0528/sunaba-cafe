<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>すなばカフェ</title>

<style>
body{
  margin:0;
  font-family:serif;
  background:#f7f1e8;
  color:#3e2f25;
  text-align:center;
}

header{
  background:#4a3428;
  color:#fff;
  padding:40px 20px;
}

.hero{
  height:250px;
  background:url("master.jpg") center/cover;
}

section{
  padding:40px 20px;
}

.owner img{
  width:200px;
  border-radius:50%;
  margin:20px auto;
}

.menu img{
  width:90%;
  max-width:300px;
  border-radius:15px;
  margin:20px auto;
}

.box{
  background:#fff;
  padding:20px;
  border-radius:15px;
  margin:20px;
}

.map img{
  width:90%;
  max-width:500px;
  border-radius:15px;
  margin:20px auto;
}

.map iframe{
  width:90%;
  height:300px;
  border-radius:15px;
  border:none;
}

footer{
  background:#4a3428;
  color:#fff;
  padding:20px;
}
</style>
</head>

<body>

<header>
  <h1>すなばカフェ</h1>
  <p>1965年創業・全席禁煙</p>
</header>

<div class="hero"></div>

<section class="owner">
  <h2>マスター</h2>
  <img src="owner.jpg">
  <p>
    お客様の好みに合わせて豆を選び、<br>
    一杯ずつ丁寧に淹れるオリジナルコーヒー。
  </p>
</section>

<section class="menu">
  <h2>メニュー</h2>

  <img src="blend.jpg">
  <p>ブレンドコーヒー 550円</p>

  <img src="icedcoffee.jpg">
  <p>アイスコーヒー 550円</p>

  <img src="napolitan.jpg">
  <p>ナポリタン 1100円</p>

  <img src="shortcake.jpg">
  <p>ショートケーキ 450円</p>
</section>

<section>
  <h2>店舗情報</h2>
  <div class="box">
    営業時間 12:00-20:00<br>
    定休日 火曜日<br>
    場所 SUNABACO今治
  </div>
</section>

<section class="map">
  <h2>アクセス</h2>

  <!-- 地図画像 -->
  <img src="map.jpg">

  <!-- Googleマップ -->
  <iframe src="https://www.google.com/maps?q=SUNABACO今治&output=embed"></iframe>

</section>

<footer>
  © すなばカフェ
</footer>

</body>
</html>
