<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>すなばカフェ</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#f6f1e8;
  color:#4b3a2c;
}
header{
  background:#3b2a1f;
  color:#fff;
  text-align:center;
  padding:15px;
  font-size:22px;
}
.hero{
  background:#6b4b35;
  color:#fff;
  text-align:center;
  padding:60px 20px;
}
.section{
  padding:30px 20px;
  max-width:1100px;
  margin:auto;
}
.two{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:25px;
  align-items:center;
}
img{
  width:100%;
  border-radius:12px;
}
.menu-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:25px;
}
.menu-card{
  background:#fff;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}
.menu-card img{
  height:230px;
  object-fit:cover;
}
.menu-text{
  padding:15px;
}
.menu-text h3{
  margin:0;
}
.menu-text p{
  margin:5px 0 0;
  font-weight:bold;
}
.info{
  background:#fff;
  padding:20px;
  border-radius:12px;
}
footer{
  background:#3b2a1f;
  color:#fff;
  text-align:center;
  padding:10px;
  margin-top:30px;
}
@media(max-width:768px){
  .two,.menu-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>☕ すなばカフェ</header>

<section class="hero">
  <h1>すなばカフェ</h1>
  <p>1965年創業の老舗喫茶店</p>
</section>

<section class="section two">
  <img src="master.jpg" alt="マスター">
  <div>
    <h2>マスターのこだわり</h2>
    <p>
      実際にお話を聞いて、その人の好みに合った豆を挽いて淹れる
      オリジナルコーヒーをご提供しています。
    </p>
  </div>
</section>

<section class="section">
  <h2>メニュー</h2>

  <div class="menu-grid">

    <div class="menu-card">
      <img src="blend.jpg">
      <div class="menu-text">
        <h3>オリジナルブレンドコーヒー</h3>
        <p>550円</p>
      </div>
    </div>

    <div class="menu-card">
      <img src="icedcoffee.jpg">
      <div class="menu-text">
        <h3>アイスコーヒー</h3>
        <p>550円</p>
      </div>
    </div>

    <div class="menu-card">
      <img src="napolitan.jpg">
      <div class="menu-text">
        <h3>ナポリタン</h3>
        <p>1100円</p>
      </div>
    </div>

    <div class="menu-card">
      <img src="shortcake.jpg">
      <div class="menu-text">
        <h3>いちごのショートケーキ</h3>
        <p>450円</p>
      </div>
    </div>

  </div>
</section>

<section class="section two">
  <div class="info">
    <h2>店舗情報</h2>
    <p>営業時間：12:00〜20:00</p>
    <p>定休日：火曜日</p>
    <p>場所：SUNABACO今治</p>
    <p>全席禁煙</p>
  </div>
  <img src="map.jpg" alt="地図">
</section>

<footer>© すなばカフェ</footer>

</body>
</html>
